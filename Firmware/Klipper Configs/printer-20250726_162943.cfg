[include mainsail.cfg]
#[virtual_sdcard]
#path: home/biqu/printer_data/gcodes
#####################################
#              PRINTER              #
#####################################

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 10000
max_accel_to_decel: 3000
max_z_velocity: 200
max_z_accel: 1000

square_corner_velocity: 2.0

[input_shaper]
shaper_freq_x: 23.0
shaper_freq_y: 39.0
#shaper_freq_x: 13.0
#shaper_freq_y: 39.0
shaper_type_x: mzv
shaper_type_y: mzv

[bed_screws]
#need calibration
screw1: 20,20
screw2: 160,20
screw3: 160,160
screw4: 20,160

[bed_mesh]
speed: 80
horizontal_move_z: 1
mesh_min: 10, 10
mesh_max: 170, 170 #this may need to be calibrated for your individual printer
probe_count: 5,5 #this is the number of probing points on X then Y axis
mesh_pps: 2,2
fade_start: 1
fade_end: 10
fade_target: 0

#[temperature_sensor chamber]
#sensor_type: Generic 3950
#sensor_pin: PA2
#min_temp: 0
#max_temp: 100
#gcode_id: C

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000
restart_method: command

[mcu host]
serial: /tmp/klipper_host_mcu

[temperature_sensor raspberry]
sensor_type: temperature_host

[temperature_sensor MCU]
sensor_type: temperature_mcu

[static_digital_output display_reset]
pins: !PC6, !PD13

[virtual_sdcard]
path: ~/printer_data/gcodes

[gcode_arcs]
resolution: 0.05

[display_status]

[pause_resume] 

[respond]


#####################################
#        Heater Verification        #
#####################################

[verify_heater heater_bed]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

[verify_heater extruder]
max_error: 120
check_gain_time: 30
hysteresis: 5
heating_gain: 2


#####################################
